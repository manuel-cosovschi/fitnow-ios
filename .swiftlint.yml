included:
  - FitNow

excluded:
  - FitNowTests
  - FitNowUITests
  - FitNow.xcodeproj

disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - force_cast            # some SwiftUI patterns require this
  - force_try

opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - unneeded_parentheses_in_closure_argument

identifier_name:
  # Los modelos decodifican el JSON de la API tal cual, así que hay propiedades
  # en snake_case a propósito (date_start, provider_id). El guion bajo pasa a
  # ser un símbolo válido: no tiene sentido frenar el CI por espejar las claves
  # del backend, y renombrarlas rompería la decodificación.
  allowed_symbols: ["_"]
  min_length: 1
  excluded:
    - id
    - vm
    - bg
    - x
    - y
    - p
    - e
    - a
    - s
    - q

type_name:
  min_length: 2

# Una tupla de tres se usa en un par de lugares donde armar un tipo aparte no
# aporta nada. Se avisa a partir de tres y se corta en cuatro.
large_tuple:
  warning: 3
  error: 4
