name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin fijar versión de Xcode: fijar la 16.3 dejaba el SDK en iOS 18.4, por
      # debajo del deployment target del proyecto (18.5) y sin ningún runtime de
      # simulador compatible en el runner, así que el catálogo de assets no
      # compilaba nunca y los tests no encontraban destino.
      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FitNow.xcodeproj \
            -scheme FitNow

      # pipefail y sin "|| true": antes cualquier falla de compilación se
      # tragaba y el job daba verde con el build roto.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FitNow.xcodeproj \
            -scheme FitNow \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --quiet

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FitNow.xcodeproj \
            -scheme FitNowTests \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging FitNow/
